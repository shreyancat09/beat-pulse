<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beat Pulse - Rhythm Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-wrap">
    <canvas id="view" width="480" height="640"></canvas>

    <div id="start-menu" class="dialog">
      <h2>BEAT PULSE</h2>
      <p>Controls: D, F, J, K</p>
      
      <div class="row">
        <label>Latency Offset (ms):</label>
        <input type="range" id="offset-range" min="-200" max="200" value="0">
        <span id="offset-num">0</span>
      </div>

      <button id="btn-start">Play</button>
    </div>

    <div id="end-menu" class="dialog hidden">
      <h2>Song Complete</h2>
      <p id="stats-out"></p>
      <button id="btn-again">Restart</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
